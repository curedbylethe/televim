# git-cliff renders each release section of CHANGELOG.md from conventional
# commits. .github/workflows/release.yml runs it on the release PR that
# release-please opens; nothing else reads this file.
#
# Only feat, fix and perf reach the changelog. Everything else (docs, build,
# test, chore, refactor, style) is skipped on purpose: those are not
# user-visible. A user-visible change committed under one of those types is
# not listed. That is the ceiling of this approach.

[changelog]
header = """
# Changelog

All notable changes to televim are recorded here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/). The versioning policy
(when the version is bumped, the tag scheme, what major/minor/patch mean) is in
[`docs/decisions.md`](./docs/decisions.md).

"""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# First match wins. The skip rules come after the three that list entries.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^(docs|build|test|chore|refactor|style)", skip = true },
]
protect_breaking_commits = false
filter_commits = false
# The release tags are vX.Y.Z; the release-please tags follow the same shape.
tag_pattern = "v[0-9].*"
