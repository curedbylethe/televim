name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"

# A second push to the same branch supersedes the first run: the older tree is
# not the one that will merge, and finishing it costs a cold cache. The group is
# per workflow, event and ref, so a branch's pushes cancel each other, a push and
# the nightly never cancel each other, and another branch is untouched. A
# `labeled` event only asks for the memory budget, so it queues behind the run
# in flight instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A docs-only change does not need eight minutes of Rust. This job is what
  # says so, from the diff itself: every path ends `.md` or sits under `docs/`,
  # or the answer is "run everything". The rule lives in
  # scripts/ci/classify-changes.sh, with its table test run first.
  #
  # When the base commit cannot be diffed — a new branch's first push, a
  # force-push naming a commit this clone does not hold, a scheduled run — it
  # answers "run everything". A skipped gate is a lie about a tree nobody
  # inspected; an extra full run is only slow.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `github.event.before` is not in a single-commit clone.
          fetch-depth: 0

      - name: check the classifier
        run: scripts/ci/classify-changes.test.sh

      - name: classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "rust=$(scripts/ci/classify-changes.sh git)" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A docs-only diff has no Rust to compile. The job keeps the one check a
      # document can still break — the vendored design model — and skips the
      # rest, so `lint` goes green and can serve as a required status instead of
      # leaving a docs-only pull request waiting on a check that never reports.
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.rust == 'true'
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # `keyring`'s Linux backend talks to the Secret Service over DBus, which
      # `libdbus-sys` links against at build time.
      - name: system dependencies
        if: needs.changes.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'

      - name: fmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The `live` feature is what turns "only telegram-framework touches
      # grammers" into something a machine can check, so the rule is asserted
      # rather than assumed. See crates/proto/src/lib.rs for what may name `tl`.
      - name: boundary
        if: needs.changes.outputs.rust == 'true'
        run: make boundary

      # `--all-features` enables `telegram-framework/live`; without it the
      # grammers-backed client is not even compiled. The tests that need a real
      # datacenter skip themselves unless `TELEVIM_TEST_DC` is set.
      - name: test
        if: needs.changes.outputs.rust == 'true'
        env:
          # termlens resolves this against the test process's cwd, which for an
          # integration test is the crate directory; pin it to the workspace.
          TERMLENS_ARTIFACT_DIR: ${{ github.workspace }}/target/termlens-artifacts
        run: cargo test --all --all-features

      # termlens writes only when an error carries a screen, so a green run
      # uploads nothing; `warn` is the honest setting, not `error`.
      - name: upload PTY screens
        if: always() && needs.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: termlens-screens
          path: target/termlens-artifacts
          if-no-files-found: warn

      # The vendored design model is verified here, and the diff against the
      # OpenDesign project is not: a runner has no such project, so that half
      # skips and says so. The point of running it at all is that the vendored
      # copy's two invariants — every frame exactly 24x80, every hint inside the
      # 71-column budget — hold in the repository rather than on one machine.
      - name: design
        run: make design-check

  release:
    name: release
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'memory')))
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # `keyring`'s Linux backend talks to the Secret Service over DBus, which
      # `libdbus-sys` links against at build time.
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      # `--bins --examples`: `--examples` alone does not produce
      # `target/release/televim`, which the measurement driver launches.
      #
      # Deliberately not `--locked`: a release bumps `Cargo.toml` and leaves
      # `Cargo.lock` behind, so a locked build would fail every push to `main`
      # after a release until someone synced the lock. A plain build does that
      # on the runner.
      - name: build-release
        run: cargo build --release --bins --examples

      # The memory regression budget: measure, then compare against the stored
      # baseline and fail past it. This is a guard on *change*, not on the
      # project's declared targets, which are unchanged.
      #
      # It is not part of `make ci` because it needs a release build and a pty,
      # and neither belongs in a per-commit gate.
      #
      # This job is the gate: it runs on a push to `main`, on the nightly
      # schedule, and on a pull request labelled `memory`; an ordinary pull
      # request does not pay for it. The build above is the only one it makes.
      #
      # On a host with no stored baseline it reports and does not enforce: a
      # threshold cannot be calibrated on a machine it was never measured on.
      # The first run on a new host therefore writes its report and exits zero,
      # and a maintainer reviews that report and records it.
      - name: memory-budget
        env:
          TELEVIM_MEASURE_SKIP_BUILD: "1"
        run: |
          scripts/memory/measure.py
          scripts/memory/check.py

      # Uploaded even when the comparison failed: the report is what says why.
      - name: upload memory report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-report
          path: target/memory-report.json
          if-no-files-found: warn

