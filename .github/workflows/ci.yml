name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt / lint / test / build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      # `keyring`'s Linux backend talks to the Secret Service over DBus, which
      # `libdbus-sys` links against at build time.
      - name: system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `--all-features` enables `telegram-framework/live`; without it the
      # grammers-backed client is not even compiled. The tests that need a real
      # datacenter skip themselves unless `TELEVIM_TEST_DC` is set.
      - name: test
        run: cargo test --all --all-features

      - name: build-release
        run: cargo build --release
