name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
      dry_run:
        description: Build and smoke-test without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  changelog:
    needs: release-please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-please.outputs.release_created != 'true' && needs.release-please.outputs.tag_name == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: write the release section on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName')
          if [ -z "$branch" ]; then
            echo "no open release PR"
            exit 0
          fi
          git switch -C "$branch" "origin/$branch"

          version=$(sed -n 's/^version = "\([^"]*\)".*x-release-please-version.*/\1/p' Cargo.toml)
          base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo fa69be717a2bf44117b1c4eb35ca48db70f6ad31)

          git show origin/main:CHANGELOG.md > CHANGELOG.md
          git-cliff "$base..HEAD" --tag "v$version" --strip header -o "$RUNNER_TEMP/section.md"
          python3 scripts/release/splice-changelog.py CHANGELOG.md "$RUNNER_TEMP/section.md"

          # Keep the lockfile's package pins while syncing the workspace version.
          cargo update -p televim --precise "$version"

          git add CHANGELOG.md Cargo.lock
          if git diff --cached --quiet; then
            echo "changelog section already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "docs: changelog for $version"
          git push origin "HEAD:$branch"

  prepare:
    needs: release-please
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      publish: ${{ steps.prepare.outputs.publish }}
      reason: ${{ steps.prepare.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: validate release ref
        id: prepare
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags

          case "$EVENT_NAME" in
            push)
              if [ "$GITHUB_REF" = refs/heads/main ]; then
                tag="$RELEASE_TAG"
              else
                tag="$REF_NAME"
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                {
                  echo 'tag='
                  echo 'version='
                  echo 'publish=false'
                  echo 'reason=manual dispatch must use the main branch'
                } >> "$GITHUB_OUTPUT"
                echo 'Manual dispatch must use the main branch; build and publish are skipped.'
                exit 0
              fi
              tag="$DISPATCH_TAG"
              ;;
            *) tag='' ;;
          esac

          if [ -z "$tag" ]; then
            {
              echo 'tag='
              echo 'version='
              echo 'publish=false'
              echo 'reason=no release tag was produced'
            } >> "$GITHUB_OUTPUT"
            echo 'No release tag; build and publish are skipped.'
            exit 0
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid release tag: $tag"
            exit 1
          fi
          if ! git cat-file -e "$tag^{commit}"; then
            echo "::error::tag does not resolve to a commit: $tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "::error::tag is not on origin/main: $tag"
            exit 1
          fi

          version=${tag#v}
          tagged_version=$(git show "$tag:Cargo.toml" | sed -n 's/^version = "\([^"]*\)".*x-release-please-version.*/\1/p')
          if [ "$tagged_version" != "$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $tagged_version"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$RELEASE_VERSION" != "$version" ]; then
            echo "::error::release-please version $RELEASE_VERSION does not match $tag"
            exit 1
          fi

          publish=true
          reason='release tag validated'
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then
            publish=false
            reason='dry run requested; release mutation is disabled'
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "$reason"

  build-linux:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    permissions:
      contents: read
    steps:
      - name: system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates python3 build-essential pkg-config libdbus-1-dev

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: use current release files
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'
          git checkout origin/main -- LICENSE-MIT LICENSE-APACHE scripts/release/check-lock.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ runner.arch }}

      - name: build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          TELEVIM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEVIM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          case "$TELEVIM_API_ID" in
            ''|*[!0-9]*) echo "::error::TELEGRAM_API_ID secret is missing or not a number"; exit 1 ;;
          esac
          if [ -z "$TELEVIM_API_HASH" ]; then
            echo "::error::TELEGRAM_API_HASH secret is missing"
            exit 1
          fi

          cargo update -p televim --precise "$VERSION"
          python3 scripts/release/check-lock.py
          cargo build --release --locked --target "$TARGET" -p televim --bin televim
          binary="target/$TARGET/release/televim"
          test -s "$binary"
          [ "$("$binary" --version)" = "televim $VERSION" ]
          "$binary" --help >/dev/null

          stage="televim-$VERSION-$TARGET"
          mkdir -p "$stage" dist
          install -m 755 "$binary" "$stage/televim"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "dist/$stage.tar.gz" -C "$stage" televim README.md LICENSE-MIT LICENSE-APACHE

          verify=$(mktemp -d)
          trap 'rm -rf "$verify"' EXIT
          tar -xzf "dist/$stage.tar.gz" -C "$verify"
          (cd "$verify" && test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = 'LICENSE-APACHE LICENSE-MIT README.md televim ')
          test -x "$verify/televim"
          [ "$("$verify/televim" --version)" = "televim $VERSION" ]
          "$verify/televim" --help >/dev/null
          ldd "$verify/televim" | tee "$RUNNER_TEMP/ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/ldd.txt"; then exit 1; fi
          grep -q 'libdbus-1' "$RUNNER_TEMP/ldd.txt"
          objdump -T "$verify/televim" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: televim-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            minos: "11.0"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            minos: "10.12"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: use current release files
        run: git fetch --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' && git checkout origin/main -- LICENSE-MIT LICENSE-APACHE scripts/release/check-lock.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ runner.arch }}

      - name: build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          MINIMUM_MACOS_VERSION: ${{ matrix.minos }}
          TELEVIM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEVIM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          case "$TELEVIM_API_ID" in
            ''|*[!0-9]*) echo "::error::TELEGRAM_API_ID secret is missing or not a number"; exit 1 ;;
          esac
          if [ -z "$TELEVIM_API_HASH" ]; then
            echo "::error::TELEGRAM_API_HASH secret is missing"
            exit 1
          fi

          cargo update -p televim --precise "$VERSION"
          python3 scripts/release/check-lock.py
          cargo build --release --locked --target "$TARGET" -p televim --bin televim
          binary="target/$TARGET/release/televim"
          test -s "$binary"
          [ "$("$binary" --version)" = "televim $VERSION" ]
          "$binary" --help >/dev/null

          stage="televim-$VERSION-$TARGET"
          mkdir -p "$stage" dist
          install -m 755 "$binary" "$stage/televim"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "dist/$stage.tar.gz" -C "$stage" televim README.md LICENSE-MIT LICENSE-APACHE

          verify=$(mktemp -d)
          trap 'rm -rf "$verify"' EXIT
          tar -xzf "dist/$stage.tar.gz" -C "$verify"
          (cd "$verify" && test "$(find . -type f -print | sed 's|^./||' | sort | tr '\n' ' ')" = 'LICENSE-APACHE LICENSE-MIT README.md televim ')
          test -x "$verify/televim"
          [ "$("$verify/televim" --version)" = "televim $VERSION" ]
          "$verify/televim" --help >/dev/null
          otool -L "$verify/televim" | tee "$RUNNER_TEMP/otool.txt"
          if grep -Eq '/opt/homebrew|/usr/local' "$RUNNER_TEMP/otool.txt"; then exit 1; fi
          vtool -show-build "$verify/televim" | tee "$RUNNER_TEMP/vtool.txt"
          actual_minos=$(awk '
            /cmd LC_BUILD_VERSION/ { mode="build"; next }
            /cmd LC_VERSION_MIN_MACOSX/ { mode="legacy"; next }
            mode == "build" && $1 == "minos" { print $2; exit }
            mode == "legacy" && $1 == "version" { print $2; exit }
          ' "$RUNNER_TEMP/vtool.txt")
          if [ "$actual_minos" != "$MINIMUM_MACOS_VERSION" ]; then
            echo "::error::expected macOS minimum $MINIMUM_MACOS_VERSION, got $actual_minos"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: televim-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: use current release files
        run: git fetch --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' && git checkout origin/main -- LICENSE-MIT LICENSE-APACHE scripts/release/check-lock.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-${{ runner.arch }}

      - name: build, package, and smoke-test
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TELEVIM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEVIM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        shell: pwsh
        run: |
          if ($env:TELEVIM_API_ID -notmatch '^[0-9]+$') { throw 'TELEGRAM_API_ID secret is missing or not a number' }
          if ([string]::IsNullOrEmpty($env:TELEVIM_API_HASH)) { throw 'TELEGRAM_API_HASH secret is missing' }

          cargo update -p televim --precise $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock version sync failed' }
          python scripts/release/check-lock.py
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock changed outside the televim package entry' }

          cargo build --release --locked --target x86_64-pc-windows-msvc -p televim --bin televim
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
          $binary = 'target/x86_64-pc-windows-msvc/release/televim.exe'
          if (-not (Test-Path $binary) -or (Get-Item $binary).Length -eq 0) { throw 'release executable is missing' }
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "televim $env:VERSION") { throw "unexpected --version output: $version" }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '--help failed' }

          $stage = "televim-$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $stage, 'dist' | Out-Null
          Copy-Item $binary "$stage/televim.exe"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          $archive = "dist/$stage.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          $verify = Join-Path $env:RUNNER_TEMP 'televim-verify'
          New-Item -ItemType Directory -Force $verify | Out-Null
          Expand-Archive -Path $archive -DestinationPath $verify
          $expected = @('LICENSE-APACHE', 'LICENSE-MIT', 'README.md', 'televim.exe')
          $actual = @(Get-ChildItem $verify -File | ForEach-Object Name | Sort-Object)
          if (Compare-Object $expected $actual) { throw "unexpected archive contents: $actual" }
          if (-not (Test-Path "$verify/televim.exe")) { throw 'archive has no televim.exe' }
          $version = & "$verify/televim.exe" --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "televim $env:VERSION") { throw "unexpected packaged --version output: $version" }
          & "$verify/televim.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'packaged --help failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: televim-x86_64-pc-windows-msvc
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build-linux, build-macos, build-windows]
    if: always() && !cancelled() && needs.prepare.outputs.publish == 'true' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: televim-*
          path: dist
          merge-multiple: true

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: check staged assets and create checksums
        run: |
          set -euo pipefail
          expected="televim-$VERSION-aarch64-apple-darwin.tar.gz
          televim-$VERSION-x86_64-apple-darwin.tar.gz
          televim-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          televim-$VERSION-aarch64-unknown-linux-gnu.tar.gz
          televim-$VERSION-x86_64-pc-windows-msvc.zip"
          actual=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "$actual" = "$(printf '%s\n' "$expected" | sort)" ]
          (cd dist && for file in televim-*.tar.gz televim-*.zip; do sha256sum "$file"; done | LC_ALL=C sort -k2 > SHA256SUMS)

      - name: create or verify a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if release=$(gh release view "$TAG" --json isDraft,assets 2>/dev/null); then
            is_draft=$(printf '%s' "$release" | jq -r '.isDraft')
            if [ "$is_draft" != true ]; then
              echo "::error::refusing to overwrite published release $TAG"
              exit 1
            fi
          else
            git-cliff --tag "$TAG" "$TAG^..$TAG" --strip header -o "$RUNNER_TEMP/notes.md"
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              printf 'televim %s\n' "$TAG" > "$RUNNER_TEMP/notes.md"
            fi
            gh release create "$TAG" --draft --verify-tag --title "televim $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: download and verify published draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --dir verify
          expected="SHA256SUMS
          televim-$VERSION-aarch64-apple-darwin.tar.gz
          televim-$VERSION-x86_64-apple-darwin.tar.gz
          televim-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          televim-$VERSION-aarch64-unknown-linux-gnu.tar.gz
          televim-$VERSION-x86_64-pc-windows-msvc.zip"
          actual=$(find verify -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "$actual" = "$(printf '%s\n' "$expected" | sort)" ]
          (cd verify && sha256sum -c SHA256SUMS)

          for archive in verify/*.tar.gz; do
            tar -tvzf "$archive" | tee "$RUNNER_TEMP/archive-list.txt"
            grep -Eq '^-rwxr-xr-x .* televim$' "$RUNNER_TEMP/archive-list.txt"
            for file in README.md LICENSE-MIT LICENSE-APACHE; do grep -q " $file$" "$RUNNER_TEMP/archive-list.txt"; done
          done
          for archive in verify/*.zip; do
            unzip -l "$archive" | tee "$RUNNER_TEMP/archive-list.txt"
            for file in televim.exe README.md LICENSE-MIT LICENSE-APACHE; do grep -q " $file$" "$RUNNER_TEMP/archive-list.txt"; done
          done

          release=$(gh release view "$TAG" --json assets)
          for archive in dist/*.tar.gz dist/*.zip; do
            name=${archive##*/}
            local_digest="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
            remote_digest=$(printf '%s' "$release" | jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest')
            [ "$local_digest" = "$remote_digest" ]
          done

      - name: publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false

      - name: print recovery command
        if: failure()
        run: |
          echo "Recovery: gh workflow run release.yml -f tag='$TAG'"
