[package]
name = "televim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "televim"
path = "src/main.rs"

[dependencies]
domain.workspace = true
tui.workspace = true

# Both halves of the client, on: this is a Telegram client, and neither crate is
# any use to it without its own `live` feature. That feature stays off inside
# them so that `make boundary` can prove they pull in no `grammers` crate on
# their own; asking for it here is the composition root saying it wants the
# whole thing. `app` is deliberately not part of that check — it is the one
# crate allowed to see everything.
proto = { workspace = true, features = ["live"] }

# Named directly rather than reached through `proto`: the login flow belongs to
# the framework, and `ProtoClient::new` takes a framework `Client`.
telegram-framework = { workspace = true, features = ["live"] }

tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
config.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The OSC 52 clipboard sequence is base64 inside, and `runtime.rs` is the only
# place that writes one.
base64.workspace = true

crossterm.workspace = true
ratatui.workspace = true

[dev-dependencies]
# The integration tests keep their session in a scratch file, so a run never
# touches the developer's own.
tempfile.workspace = true
termlens.workspace = true

[lints]
workspace = true
