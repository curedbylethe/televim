[package]
name = "telegram-framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Compiles the `grammers`-backed client: `ClientBuilder`, the login/2FA flow and
# the raw API escape hatch. It is off by default so that `proto`, `domain` and
# `tui` can be proven, with `cargo tree`, to pull in no `grammers` crate at all.
# Session storage and its backends are always available.
live = [
    "dep:grammers-client",
    "dep:grammers-tl-types",
    "dep:grammers-mtproto",
    "dep:grammers-mtsender",
]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring.workspace = true

grammers-client = { workspace = true, optional = true }
grammers-tl-types = { workspace = true, optional = true }
grammers-mtproto = { workspace = true, optional = true }
grammers-mtsender = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Compile-time assertions. Used to lock the "a login token cannot be cloned or
# reused" guarantee with the compiler rather than with a convention.
static_assertions = "1.1"

[lints]
workspace = true
