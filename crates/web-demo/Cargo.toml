# Detached on purpose: the root workspace keeps its native --all-features
# build and make ci free of wasm-only crates and Trunk tooling.
[workspace]
members = ["."]
resolver = "2"

[workspace.dependencies]
ratzilla = "0.3.1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "Navigator", "Clipboard", "HtmlInputElement", "FileList", "File", "Blob",
  "BlobPropertyBag", "Url", "HtmlAnchorElement",
] }
js-sys = "0.3.107"
gloo-timers = "0.4.0"
console_error_panic_hook = "0.1.7"
web-time = "1.1"

[package]
name = "web-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
domain = { path = "../domain" }
tui = { path = "../tui" }
demo-support = { path = "../demo-support" }
ratzilla.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys.workspace = true
gloo-timers.workspace = true
console_error_panic_hook.workspace = true
web-time.workspace = true

[[bin]]
name = "televim-web-demo"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
