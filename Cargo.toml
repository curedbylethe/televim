[workspace]
resolver = "2"
members = [
    "crates/telegram-framework",
    "crates/proto",
    "crates/domain",
    "crates/tui",
    "crates/app",
]

[workspace.package]
version = "0.2.0" # x-release-please-version
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Telegram. Published on crates.io and taken from there: upstream stopped
# tagging after `v0.8.0`, so no tag can name a released version. See the
# docs/dependencies.md for the evidence.
grammers-client = { version = "0.10.0", default-features = false }
grammers-tl-types = { version = "0.10.0", default-features = false, features = ["tl-mtproto"] }
grammers-mtproto = { version = "0.10.0" }
grammers-mtsender = { version = "0.10.0" }

# TUI
ratatui = "0.30"
crossterm = "0.28"
vim-line = "7.7"
# One use: how wide a string is on a terminal. `ratatui` already resolves it,
# so `tui`'s row layout and its caret column share the same table.
unicode-width = "0.2"
# One use: grapheme cluster edges, in `tui::grapheme`. A delete removes one
# and a row is never cut inside one. Already in the lockfile via ratatui.
unicode-segmentation = "1"
# One use: which direction a run of characters reads, in `tui::bidi`. A
# terminal reorders nothing, so the row has to be permuted into visual order
# here; the UAX #9 implementation is the one thing that knows by what rule.
# Already in the lockfile via ratatui.
unicode-bidi = "0.3.18"
# The GitHub gemoji catalog, for the input line's `:shortcode` completion. The
# whole catalog rather than a curated subset: 1914 emoji, of which 1870 carry a
# shortcode, at the cost of roughly 0.5 MB of binary and 2 MB of `phf` tables
# touched only while composing, and about 5 µs to scan — a table this workspace
# otherwise maintains by hand for bytes it does not need.
emojis = "0.9"
# One use: decoding static WEBP stickers to RGBA in `tui::sticker`. The
# dedicated decoder rather than `image`: Q2 weighed both by stripped release
# binary delta and the dedicated crate cost less (report in STAGE-02).
image-webp = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI / config
clap = { version = "4", features = ["derive"] }
config = "0.15"
# One use: loading `.env` so the credentials it holds reach `Config`. A missing
# file is not an error.
dotenvy = "0.15"

# Utils
# One use: base64 for the OSC 52 clipboard sequence, which is written by the
# terminal's owner rather than by `tui`.
base64 = "0.22"
# `keyring` ships no default backend, so each supported platform store is
# requested explicitly. They are target-gated, so enabling all of them is safe
# on every platform; on Linux the Secret Service backend needs `libdbus`.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Session file encryption, in `telegram-framework::sealed`. AES-256-GCM-SIV is
# nonce-misuse-resistant (RFC 8452) and shares the `aes` build already in the
# lockfile; Argon2id stretches a passphrase into the file key. Both are pure
# Rust, so no C toolchain is needed on any platform.
aes-gcm-siv = { version = "0.12", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# One use: random nonces, salts and the keyring-held file key.
getrandom = "0.4"
# One use: wiping key material when it is dropped. Already in the lockfile.
zeroize = "1"

# Dev-only
tempfile = "3"
# Micro-benchmarks, in `crates/{domain,tui}/benches`. Dev-only: no crate's
# `[dependencies]` names it, so a release build never carries it.
criterion = "0.8.2"
# Compile-time assertions. Used to lock the "a login token cannot be cloned or
# reused" guarantee with the compiler rather than with a convention.
static_assertions = "1.1"
# Drives the televim binary in a pseudo-terminal for the PTY integration tests
# in `app/tests/tui_e2e.rs`. Dev-only: no crate's `[dependencies]` names it.
termlens = "0.11.5"

# Internal crates
domain = { path = "crates/domain" }
proto = { path = "crates/proto" }
tui = { path = "crates/tui" }
telegram-framework = { path = "crates/telegram-framework" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
